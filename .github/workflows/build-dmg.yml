name: Build DMG

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: brew install librsvg
      - run: ./build-dmg.sh
      - uses: actions/upload-artifact@v7
        with:
          path: dist/Doorbell.dmg
          archive: false
          if-no-files-found: error
